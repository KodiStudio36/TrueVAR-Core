<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Poomsae Elimination — Control Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #0b0e14;
            --panel: #12161f;
            --panel-2: #171c27;
            --border: #232a38;
            --text: #e8ecf3;
            --muted: #8b93a7;
            --blue: #1d4ed8;
            --blue-2: #2563eb;
            --orange: #c2410c;
            --orange-2: #ea580c;
            --green: #16a34a;
            --accent: #f43f5e;
            --amber: #f59e0b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, "Segoe UI", Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Top bar ──────────────────────────────────────────────────── */
        .topbar {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 0.6rem 1.25rem;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .topbar-title {
            font-weight: 700;
            font-size: 1.05rem;
            white-space: nowrap;
        }

        .nav-arrow {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            padding: 0.4rem 0.7rem;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .nav-arrow:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .topbar-center {
            flex: 1;
            text-align: center;
            min-width: 0;
        }

        .topbar-category {
            font-size: 0.85rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topbar-meta {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 0.1rem;
        }

        .topbar-meta .accent {
            color: var(--accent);
            font-weight: 600;
        }

        .text-muted {
            color: var(--muted);
        }

        /* ── Main layout ──────────────────────────────────────────────── */
        .main {
            flex: 1;
            display: grid;
            grid-template-columns: 320px 1fr 300px;
            gap: 1rem;
            padding: 1rem;
            min-height: 0;
        }

        .corners {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-height: 0;
        }

        /* Solo (cut-off) match: only the blue corner renders at all. */
        .corner {
            flex: 1;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            min-height: 0;
        }

        .corner-identity {
            width: 260px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 1.25rem 1.25rem;
            gap: 0.35rem;
        }

        .corner-blue .corner-identity {
            background: linear-gradient(135deg, var(--blue), var(--blue-2));
        }

        .corner-red .corner-identity {
            background: linear-gradient(135deg, var(--orange), var(--orange-2));
        }

        .corner-name {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .corner-club {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .corner-current-score {
            font-size: 1.05rem;
            margin-top: 0.6rem;
            font-weight: 600;
        }

        .corner-scores {
            flex: 1;
            padding: 0.75rem 1rem;
            overflow-y: auto;
        }

        .score-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }

        .score-table th,
        .score-table td {
            padding: 0.35rem 0.5rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .score-table th {
            color: var(--muted);
            font-weight: 600;
        }

        .score-table .num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .judge-status {
            display: inline-block;
            margin-left: .35rem;
            padding: 0 .4rem;
            border-radius: 999px;
            font-size: .68rem;
            font-weight: 700;
            font-style: normal;
            text-decoration: none;
            vertical-align: middle;
        }

        .judge-status--submitted {
            background: rgba(34, 197, 94, .18);
            color: #22c55e;
        }

        .judge-status--scoring {
            background: rgba(245, 158, 11, .18);
            color: #f59e0b;
        }

        .judge-status--waiting {
            background: rgba(148, 163, 184, .15);
            color: var(--muted);
        }

        .score-submitted-row td:first-child {
            box-shadow: inset 3px 0 0 #22c55e;
        }

        .judges-submitted {
            font-size: .78rem;
            font-weight: 700;
            color: var(--muted);
            margin: 0 0 .3rem;
        }

        .judges-submitted--all {
            color: #22c55e;
        }

        .score-default-row td {
            color: var(--muted);
            font-style: italic;
        }

        .score-trimmed-row td {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .score-summary-row td {
            color: var(--muted);
        }

        .score-summary-row:first-of-type td {
            border-top: 2px solid var(--border);
        }

        .score-final-row td {
            color: var(--text);
            font-weight: 700;
            border-bottom: none;
        }

        .score-waiting {
            color: var(--muted);
            font-size: 0.85rem;
            padding: 1rem 0;
            text-align: center;
        }

        /* ── Category Results preview (centre, in that stage) ─────────── */
        .cat-preview {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.75rem 1rem;
        }

        .cat-preview-head {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .cat-preview tr.current td {
            background: rgba(244, 63, 94, .14);
        }

        .cat-preview tr.pending td {
            color: var(--muted);
        }

        .cat-badge {
            display: inline-block;
            padding: 0 .4rem;
            border-radius: 999px;
            font-size: .68rem;
            font-weight: 800;
            margin-left: .3rem;
        }

        .cat-badge--q {
            background: rgba(34, 197, 94, .2);
            color: #22c55e;
        }

        .cat-badge--m1 {
            background: #f5c542;
            color: #14110a;
        }

        .cat-badge--m2 {
            background: #c8ced8;
            color: #14110a;
        }

        .cat-badge--m3 {
            background: #cd7f32;
            color: #14110a;
        }

        /* ── Right: lifecycle ─────────────────────────────────────────── */
        .side {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .lifecycle {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            overflow-y: auto;
            min-height: 0;
        }

        .queue-panel {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            overflow-y: auto;
            min-height: 0;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.6rem;
        }

        .queue-item {
            padding: 0.6rem 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--panel-2);
            cursor: pointer;
            font-size: 0.82rem;
        }

        .queue-item:hover {
            border-color: var(--muted);
        }

        .queue-item.active {
            background: var(--blue-2);
            border-color: var(--blue-2);
        }

        .queue-item-header {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 0.25rem;
        }

        .queue-item.active .queue-item-header {
            color: rgba(255, 255, 255, 0.75);
        }

        .queue-item-names {
            font-weight: 600;
        }

        .queue-item.active .queue-item-names {
            color: #fff;
        }

        .stage-pill {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 0.75rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.88rem;
            background: var(--panel-2);
            color: var(--muted);
            border: 1px solid var(--border);
            cursor: default;
            user-select: none;
            flex-shrink: 0;
        }

        .stage-pill-main {
            flex: 1;
            min-width: 0;
            text-align: center;
        }

        .stage-pill.clickable {
            cursor: pointer;
        }

        .stage-pill.clickable:hover {
            border-color: var(--muted);
        }

        .stage-pill.active {
            background: var(--blue-2);
            color: #fff;
            border-color: var(--blue-2);
        }

        .stage-pill.done {
            background: #14532d;
            color: #bbf7d0;
            border-color: #166534;
        }

        .stage-pill.final {
            background: var(--accent);
            color: #fff;
        }

        .stage-pill.final.done {
            background: #14532d;
            color: #bbf7d0;
        }

        .stage-pill-sub {
            font-size: .74em;
            font-weight: 700;
            opacity: .85;
            margin-top: 2px;
            letter-spacing: .02em;
        }

        .stage-pill-countdown {
            color: #fde68a;
        }

        /* Auto toggle on a result stage's pill — on = runs by itself. */
        .auto-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            flex-shrink: 0;
            padding: 0.2rem 0.45rem;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: .04em;
            text-transform: uppercase;
            cursor: pointer;
            background: rgba(0, 0, 0, .3);
            color: rgba(255, 255, 255, .55);
            border: 1px solid rgba(255, 255, 255, .15);
        }

        .auto-toggle.on {
            background: rgba(34, 197, 94, .2);
            color: #4ade80;
            border-color: rgba(34, 197, 94, .5);
        }

        .auto-toggle input {
            margin: 0;
            accent-color: #22c55e;
            cursor: pointer;
        }

        .stage-arrow {
            text-align: center;
            color: var(--muted);
            font-size: 0.65rem;
            line-height: 1;
            flex-shrink: 0;
        }

        /* ── Bottom: timer + controls ─────────────────────────────────── */
        .footer {
            display: flex;
            align-items: stretch;
            gap: 0.75rem;
            padding: 0 1rem 1rem;
            flex-shrink: 0;
        }

        .timer {
            flex: 1;
            background: var(--green);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: .5rem 1.5rem;
            color: #06240f;
            cursor: pointer;
            user-select: none;
            transition: filter 0.1s;
        }

        .timer:hover {
            filter: brightness(1.08);
        }

        /* Always green — only the TEXT turns white when not counting down. */
        .timer.paused,
        .timer.disabled {
            color: #ffffff;
        }

        .timer.disabled {
            cursor: default;
        }

        .timer.disabled:hover {
            filter: none;
        }

        .timer-label {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .timer-sub {
            font-size: 0.78rem;
            opacity: 0.85;
        }

        .timer-clock {
            font-size: 2.4rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        .hidden {
            display: none !important;
        }

        .nav-icon-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .gear-icon {
            font-weight: 800;
            font-size: 1.05rem;
            line-height: 1;
        }

        .judge-chips {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            padding: 1rem 1rem 0rem 1rem;
        }

        .judge-chip {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.4rem 1rem;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }

        .judge-chip:hover {
            border-color: var(--muted);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 1.5rem;
        }

        .modal-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            width: min(90vw, 420px);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .qr-code-box {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border-radius: 10px;
            padding: 1rem;
            min-height: 232px;
        }

        .settings-field {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            margin-bottom: 1rem;
            font-size: 0.82rem;
            color: var(--muted);
            font-weight: 600;
        }

        .settings-field small {
            font-weight: 400;
        }

        .settings-field select,
        .settings-field input {
            padding: 0.5rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel-2);
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 400;
        }

        .settings-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .settings-save-btn {
            width: 100%;
            margin-top: 0.5rem;
            background: var(--blue-2);
            border-color: var(--blue-2);
            color: #fff;
            font-weight: 700;
            padding: 0.6rem;
        }

        .restart-btn {
            flex-shrink: 0;
            background: var(--accent);
            border: none;
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            border-radius: 10px;
            padding: 0 1.75rem;
            cursor: pointer;
        }

        .restart-btn:hover:not(:disabled) {
            filter: brightness(1.08);
        }

        .restart-btn:disabled,
        .penalty-btn:disabled {
            opacity: 0.35;
            filter: grayscale(0.6) brightness(0.7);
            cursor: not-allowed;
        }

        .penalty-group {
            display: flex;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .penalty-btn {
            border: none;
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 10px;
            padding: 0 1.25rem;
            cursor: pointer;
            background: #b45309;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.1rem;
            line-height: 1.15;
        }

        .penalty-btn small {
            font-weight: 600;
            font-size: 0.72rem;
            opacity: 0.85;
            max-width: 9rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .penalty-btn.corner-blue-btn {
            background: var(--blue-2);
        }

        .penalty-btn.corner-red-btn {
            background: var(--orange-2);
        }

        .penalty-btn:hover:not(:disabled) {
            filter: brightness(1.1);
        }

        .live-line {
            font-size: 0.74rem;
            margin-top: 0.15rem;
        }

        .live-line .live-dot {
            display: inline-block;
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
            background: var(--accent);
            margin-right: 0.3rem;
            vertical-align: middle;
        }

        .live-line button {
            background: none;
            border: none;
            color: var(--accent);
            font-weight: 700;
            cursor: pointer;
            padding: 0;
            font-size: inherit;
            text-decoration: underline;
        }

        .not-live-note {
            color: var(--muted);
            font-size: 0.9rem;
            padding: 2rem 1rem;
            text-align: center;
            line-height: 1.5;
        }

        .queue-live-tag {
            background: var(--accent);
            color: #fff;
            border-radius: 4px;
            padding: 0 0.35rem;
            margin-left: 0.35rem;
            font-size: 0.65rem;
        }

        .archive-line {
            margin-top: .6rem;
            text-align: center;
            font-size: .8rem;
            min-height: 1.2em;
            flex-shrink: 0;
        }

        .archive-line button {
            margin-left: .35rem;
            font-size: .75rem;
            padding: .15rem .5rem;
            border-radius: 6px;
            border: 1px solid var(--border, #334155);
            background: transparent;
            color: inherit;
            cursor: pointer;
        }

        .archive {
            font-weight: 700;
        }

        .archive--saved {
            color: #22c55e;
        }

        .archive--saving {
            color: #f59e0b;
        }

        .archive--failed {
            color: #ef4444;
        }

        .stage-pill.next-step {
            outline: 2px solid #22c55e;
            outline-offset: 2px;
            animation: next-step-pulse 1.4s ease-in-out infinite;
        }

        @keyframes next-step-pulse {
            50% {
                outline-color: rgba(34, 197, 94, .25);
            }
        }

        .stage-pill.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Accuracy / Presentation cells the operator can click to correct. */
        .score-edit {
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.1s, box-shadow 0.1s;
        }

        .score-edit:hover {
            background: rgba(37, 99, 235, .18);
            box-shadow: inset 0 0 0 1px var(--blue-2);
            color: var(--text) !important;
        }

        .judge-status--edited {
            background: rgba(37, 99, 235, .2);
            color: #93c5fd;
        }

        .scores-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: .3rem;
        }

        .scores-head .judges-submitted {
            margin: 0;
        }

        .reset-full-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 6px;
            padding: 0.3rem 0.7rem;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .reset-full-btn:hover:not(:disabled) {
            background: var(--accent);
            color: #fff;
        }

        .reset-full-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .score-editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .score-editor-total {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0.6rem 0.2rem;
            margin-bottom: 0.5rem;
            border-top: 1px solid var(--border);
            font-weight: 700;
        }

        .score-editor-total span:last-child {
            font-size: 1.4rem;
            font-variant-numeric: tabular-nums;
        }

        .score-editor-note {
            font-size: 0.75rem;
            color: var(--muted);
            margin: 0 0 0.75rem;
            line-height: 1.4;
        }

        .penalty-clear {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.72rem;
            padding: 0 0 0 0.3rem;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="topbar-title">Poomsae Elimination</div>
        <button class="nav-arrow nav-icon-btn" id="settingsBtn" onclick="openSettingsModal()"
            title="Judge count, scoring method, deductions, automatic result delays">
            <span class="gear-icon">⚙</span> Settings
        </button>
        <button class="nav-arrow" id="prevCategoryBtn" onclick="changeCategory(-1)"
            title="First match of the previous category">&laquo; Previous category</button>
        <button class="nav-arrow" id="prevMatchBtn" onclick="changeMatch(-1)">&larr; Previous match</button>
        <div class="topbar-center">
            <div class="topbar-category" id="categoryLine">Loading…</div>
            <div class="topbar-meta" id="metaLine"></div>
            <div class="live-line" id="liveLine"></div>
        </div>
        <button class="nav-arrow" id="nextMatchBtn" onclick="changeMatch(1)">Next match &rarr;</button>
        <button class="nav-arrow" id="nextCategoryBtn" onclick="changeCategory(1)"
            title="First match of the next category">Next category &raquo;</button>
        <button class="nav-arrow" id="reloadBtn" onclick="reloadSchedule()"
            title="Re-read this court's matches after brackets were re-pushed from the website — stays on the current match">&#x21bb;
            Reload schedule</button>
    </div>

    <div id="judgeChipsEl" class="judge-chips"></div>

    <div id="settingsOverlay" class="modal-overlay hidden" onclick="if (event.target === this) closeSettingsModal()">
        <div class="modal-panel">
            <div class="modal-header">
                <span>Settings</span>
                <button class="nav-arrow" onclick="closeSettingsModal()">Close</button>
            </div>
            <label class="settings-field">
                <span>Number of judges</span>
                <select id="settingsJudgeCount">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                </select>
            </label>
            <label class="settings-field">
                <span>Scoring method</span>
                <select id="settingsScoringMethod">
                    <option value="sum_all">Count all judges</option>
                    <option value="trim_high_low">Remove highest &amp; lowest</option>
                </select>
            </label>
            <div class="settings-row">
                <label class="settings-field">
                    <span>Restart deduction</span>
                    <input type="number" id="settingsRestartDeduction" step="0.1" value="-0.6">
                </label>
                <label class="settings-field">
                    <span>Penalty (per tap)</span>
                    <input type="number" id="settingsPenaltyDeduction" step="0.1" value="-0.3">
                </label>
            </div>
            <div class="settings-row">
                <label class="settings-field">
                    <span>Final Results after (s)</span>
                    <input type="number" id="settingsFinalDelay" min="0" max="300" step="1" value="5">
                    <small>after the last Results, when on Auto</small>
                </label>
                <label class="settings-field">
                    <span>Category Results after (s)</span>
                    <input type="number" id="settingsCategoryDelay" min="0" max="300" step="1" value="8">
                    <small>after Final Results, when on Auto</small>
                </label>
            </div>
            <button class="nav-arrow settings-save-btn" onclick="saveSettings()">Save</button>
        </div>
    </div>

    <div id="scoreEditorOverlay" class="modal-overlay hidden" onclick="if (event.target === this) closeScoreEditor()">
        <div class="modal-panel">
            <div class="modal-header">
                <span id="scoreEditorTitle">Edit score</span>
                <button class="nav-arrow" onclick="closeScoreEditor()">Close</button>
            </div>
            <p class="score-editor-note" id="scoreEditorSub"></p>
            <div class="score-editor-grid">
                <label class="settings-field">
                    <span id="scoreEditorAccLabel">Accuracy (0 – 4.0)</span>
                    <input type="number" id="scoreEditorAccuracy" min="0" max="4" step="0.1"
                        oninput="updateScoreEditorTotal()">
                </label>
                <label class="settings-field">
                    <span>Presentation (0 – 6.0)</span>
                    <input type="number" id="scoreEditorPresentation" min="0" max="6" step="0.1"
                        oninput="updateScoreEditorTotal()">
                </label>
            </div>
            <div class="score-editor-total"><span>Total</span><span id="scoreEditorTotal">—</span></div>
            <p class="score-editor-note">Counts as this judge's submitted score and shows as <strong>Edited</strong>.
            </p>
            <button class="nav-arrow settings-save-btn" onclick="saveScoreEdit()">Save score</button>
        </div>
    </div>

    <div id="connectJudgeOverlay" class="modal-overlay hidden"
        onclick="if (event.target === this) closeConnectJudgeModal()">
        <div class="modal-panel">
            <div class="modal-header">
                <span id="judgeQrModalTitle">Judge</span>
                <button class="nav-arrow" onclick="closeConnectJudgeModal()">Close</button>
            </div>
            <p class="text-muted" style="font-size: 0.85rem; margin: 0 0 0.75rem;">
                Open the judge app and scan this code — it tells that device it's THIS judge, on this court.
            </p>
            <div id="judgeQrCode" class="qr-code-box"></div>
            <p class="text-muted" style="font-size: 0.72rem; margin-top: 0.75rem; text-align: center;"
                id="judgeQrPayloadText"></p>
        </div>
    </div>

    <div class="main">
        <div class="queue-panel" id="queuePanelEl"></div>

        <div class="corners" id="cornersEl"></div>

        <div class="side">
            <div class="lifecycle" id="lifecycleEl"></div>
            <div class="archive-line" id="archiveLine"></div>
        </div>
    </div>

    <div class="footer">
        <button class="restart-btn" id="restartBtn" onclick="restartRound()"
            title="Solo performance only: clears every judge's score for the CURRENT poomsae — does not touch the timer — and applies the automatic restart deduction">Restart</button>
        <div class="penalty-group" id="penaltyGroup"></div>
        <div class="timer" id="timerEl" onclick="toggleTimer()">
            <div>
                <div class="timer-label" id="timerLabel">Preparation</div>
                <div class="timer-sub" id="timerSub">Click a stage on the right to begin</div>
            </div>
            <div class="timer-clock" id="timerClock">—</div>
        </div>
    </div>

    <script>
        // ── Stages — mirror plugin.py ────────────────────────────────────
        const STAGE_ORDER = ["preparation", "poomsae_1", "results_1", "poomsae_2", "results_2", "final_results", "category_results"];
        const STAGE_LABELS = {
            preparation: "Preparation",
            poomsae_1: "Poomsae 1",
            results_1: "Results 1",
            poomsae_2: "Poomsae 2",
            results_2: "Results 2",
            final_results: "Final Results",
            category_results: "Category Results",
        };
        // Scoreable stages → the RTDB key judges write under.
        const STAGE_TO_ROUND_KEY = { poomsae_1: "poomsae1", poomsae_2: "poomsae2" };
        const STAGE_RESULTS_ROUND_KEY = { results_1: "poomsae1", results_2: "poomsae2" };
        const STAGE_POOMSAE_INDEX = { poomsae_1: 0, results_1: 0, poomsae_2: 1, results_2: 1 };
        const SECOND_POOMSAE_STAGES = ["poomsae_2", "results_2"];
        // Result stages with an Auto toggle (settings auto_<stage>).
        const AUTO_STAGES = ["results_1", "results_2", "final_results", "category_results"];

        function isValidJudgeNumber(n) {
            return Number.isFinite(n) && n >= 1 && Number.isInteger(n);
        }

        let state = null;           // last /state response
        let countdownTimer = null;  // local setInterval handle — purely visual

        async function api(path, method = "GET", body) {
            const opts = { method };
            if (body !== undefined) {
                opts.headers = { "Content-Type": "application/json" };
                opts.body = JSON.stringify(body);
            }
            const res = await fetch(`/api/poomsae-control${path}`, opts);
            if (!res.ok) {
                const responseBody = await res.json().catch(() => ({}));
                throw new Error(extractErrorDetail(responseBody, `Request failed (${res.status})`));
            }
            return res.json();
        }

        // FastAPI's error body: a string detail, or (422) an array of
        // {loc, msg, type}.
        function extractErrorDetail(body, fallback) {
            const detail = body && body.detail;
            if (typeof detail === "string" && detail) return detail;
            if (Array.isArray(detail) && detail.length > 0) {
                return detail.map(d => {
                    const loc = Array.isArray(d.loc) ? d.loc.join(".") : "";
                    return loc ? `${loc}: ${d.msg}` : (d.msg || JSON.stringify(d));
                }).join("; ");
            }
            return fallback;
        }

        async function loadState() {
            try {
                state = await api("/state");
                render();
            } catch (err) {
                console.error("Failed to load state", err);
            }
        }

        // ── Judge QR ─────────────────────────────────────────────────────
        // The QR payload carries the judge number directly —
        // {"tournamentId", "courtId", "judgeNumber"}.
        function openJudgeQrModal(number) {
            if (!state || !state.tournamentId || !state.courtId) {
                alert("Court isn't bound to a tournament yet — nothing to connect a judge to.");
                return;
            }
            const payload = JSON.stringify({ tournamentId: state.tournamentId, courtId: state.courtId, judgeNumber: number });

            document.getElementById("judgeQrModalTitle").textContent = `Judge ${number}`;
            const box = document.getElementById("judgeQrCode");
            box.innerHTML = "";
            new QRCode(box, {
                text: payload,
                width: 220,
                height: 220,
                colorDark: "#0b0e14",
                colorLight: "#ffffff",
            });

            document.getElementById("judgeQrPayloadText").textContent = payload;
            document.getElementById("connectJudgeOverlay").classList.remove("hidden");
        }

        function closeConnectJudgeModal() {
            document.getElementById("connectJudgeOverlay").classList.add("hidden");
        }

        // ── Settings ────────────────────────────────────────────────────
        // The backend replaces ALL panel settings on save, so the Auto
        // toggles (set on the pills) are sent along unchanged.
        function openSettingsModal() {
            const s = (state && state.settings) || {};
            document.getElementById("settingsJudgeCount").value = s.judge_count ?? 3;
            document.getElementById("settingsScoringMethod").value = s.scoring_method || "sum_all";
            document.getElementById("settingsRestartDeduction").value = s.restart_deduction ?? -0.6;
            document.getElementById("settingsPenaltyDeduction").value = s.penalty_deduction ?? -0.3;
            document.getElementById("settingsFinalDelay").value = s.final_results_delay ?? 5;
            document.getElementById("settingsCategoryDelay").value = s.category_results_delay ?? 8;
            document.getElementById("settingsOverlay").classList.remove("hidden");
        }

        function closeSettingsModal() {
            document.getElementById("settingsOverlay").classList.add("hidden");
        }

        async function saveSettings() {
            const s = (state && state.settings) || {};
            const payload = {
                poomsae_seconds: s.poomsae_seconds || 90,
                judge_count: parseInt(document.getElementById("settingsJudgeCount").value, 10),
                scoring_method: document.getElementById("settingsScoringMethod").value,
                restart_deduction: parseFloat(document.getElementById("settingsRestartDeduction").value),
                penalty_deduction: parseFloat(document.getElementById("settingsPenaltyDeduction").value),
                final_results_delay: parseInt(document.getElementById("settingsFinalDelay").value, 10),
                category_results_delay: parseInt(document.getElementById("settingsCategoryDelay").value, 10),
                auto_results_1: s.auto_results_1 !== false,
                auto_results_2: s.auto_results_2 !== false,
                auto_final_results: s.auto_final_results !== false,
                auto_category_results: s.auto_category_results !== false,
            };
            try {
                await api("/settings", "POST", payload);
                closeSettingsModal();
                await loadState();
            } catch (err) {
                alert(err.message);
            }
        }

        // Auto toggle on a result stage's pill.
        async function setAuto(stage, enabled) {
            try {
                await api("/auto", "POST", { stage, enabled });
            } catch (err) {
                alert(err.message);
            }
            await loadState();
        }

        // ── Operator score correction ────────────────────────────────────
        // Clicking a judge's Accuracy or Presentation opens this editor for
        // the poomsae on screen. Values come from the last rendered table.
        let shownJudgeValues = { blue: {}, red: {} };
        let scoreEdit = null;

        function openScoreEditor(side, judge, field) {
            const values = (shownJudgeValues[side] || {})[judge];
            if (!values) return;
            const live = (state && state.live) || {};
            const corner = ((live.corners || {})[side]) || {};
            const roundKey = live.resultsRoundKey || STAGE_TO_ROUND_KEY[state.stage];
            const poomsaeLabel = roundKey === "poomsae2" ? "Poomsae 2" : "Poomsae 1";
            scoreEdit = { side, judge };
            document.getElementById("scoreEditorTitle").textContent = `Judge ${judge} — edit score`;
            document.getElementById("scoreEditorSub").textContent =
                `${corner.name || (side === "blue" ? "Blue" : "Red")} · ${poomsaeLabel}`;
            document.getElementById("scoreEditorAccLabel").textContent = `${live.isPara ? "Technical" : "Accuracy"} (0 – 4.0)`;
            const acc = document.getElementById("scoreEditorAccuracy");
            const pres = document.getElementById("scoreEditorPresentation");
            acc.value = Number(values.accuracy).toFixed(1);
            pres.value = Number(values.presentation).toFixed(1);
            updateScoreEditorTotal();
            document.getElementById("scoreEditorOverlay").classList.remove("hidden");
            const focus = field === "presentation" ? pres : acc;
            focus.focus();
            focus.select();
        }

        function closeScoreEditor() {
            scoreEdit = null;
            document.getElementById("scoreEditorOverlay").classList.add("hidden");
        }

        function updateScoreEditorTotal() {
            const acc = parseFloat(document.getElementById("scoreEditorAccuracy").value);
            const pres = parseFloat(document.getElementById("scoreEditorPresentation").value);
            document.getElementById("scoreEditorTotal").textContent =
                Number.isFinite(acc) && Number.isFinite(pres) ? (acc + pres).toFixed(2) : "—";
        }

        async function saveScoreEdit() {
            if (!scoreEdit) return;
            const accuracy = parseFloat(document.getElementById("scoreEditorAccuracy").value);
            const presentation = parseFloat(document.getElementById("scoreEditorPresentation").value);
            if (!(accuracy >= 0 && accuracy <= 4) || !(presentation >= 0 && presentation <= 6)) {
                alert("Accuracy must be between 0 and 4.0, presentation between 0 and 6.0.");
                return;
            }
            try {
                await api("/judge-score", "POST", { corner: scoreEdit.side, judge: scoreEdit.judge, accuracy, presentation });
                closeScoreEditor();
                await loadState();
            } catch (err) {
                alert(err.message);
            }
        }

        document.addEventListener("keydown", ev => {
            if (!scoreEdit) return;
            if (ev.key === "Enter") saveScoreEdit();
            if (ev.key === "Escape") closeScoreEditor();
        });

        // ── Reset performance ────────────────────────────────────────────
        // Starts the poomsae on screen completely over — no deduction.
        async function resetFullPerformance() {
            const roundKey = STAGE_TO_ROUND_KEY[state?.stage] || STAGE_RESULTS_ROUND_KEY[state?.stage];
            const label = roundKey === "poomsae2" ? "Poomsae 2" : "Poomsae 1";
            if (!confirm(`Reset ${label} completely?\n\nEvery judge's score, the restart deduction and all penalties for it are cleared, the timer goes back to full, and the judges start again from full marks. No deduction is applied.`)) return;
            try {
                await api("/round/reset-full", "POST");
                await loadState();
            } catch (err) {
                alert(err.message);
            }
        }

        // ── Restart ──────────────────────────────────────────────────────
        async function restartRound() {
            if (!confirm("Restart this poomsae? Every judge's score for it will be cleared and the automatic restart deduction applied. This does not affect the timer.")) return;
            try {
                await api("/round/reset", "POST");
                await loadState();
            } catch (err) {
                alert(err.message);
            }
        }

        function renderJudgeChips() {
            const el = document.getElementById("judgeChipsEl");
            const registry = (state && state.judgesRegistry) || {};
            const numbers = Object.keys(registry).map(Number).filter(isValidJudgeNumber).sort((a, b) => a - b);
            el.innerHTML = numbers.map(n => `
            <div class="judge-chip" onclick="openJudgeQrModal(${n})">
                <span>Judge ${n}</span>
            </div>
        `).join("");
        }

        async function reloadSchedule() {
            const btn = document.getElementById("reloadBtn");
            btn.disabled = true;
            try {
                const res = await api("/reload", "POST");
                await loadState();
                btn.textContent = `\u21bb Reloaded (${res.total})`;
                setTimeout(() => { btn.innerHTML = "&#x21bb; Reload schedule"; }, 2000);
            } catch (err) {
                alert(err.message);
            } finally {
                btn.disabled = false;
            }
        }

        async function changeCategory(direction) {
            try {
                await api(direction > 0 ? "/next-category" : "/previous-category", "POST");
                await loadState();
            } catch (err) {
                alert(err.message);
            }
        }

        async function givePenalty(corner) {
            try {
                await api("/penalty", "POST", { corner });
                await loadState();
            } catch (err) {
                alert(err.message);
            }
        }

        async function clearPenalty(corner) {
            if (!confirm("Remove this athlete's penalties for this poomsae?")) return;
            try {
                await api("/penalty/clear", "POST", { corner });
                await loadState();
            } catch (err) {
                alert(err.message);
            }
        }

        async function changeMatch(direction) {
            try {
                await api(direction > 0 ? "/next-match" : "/previous-match", "POST");
                await loadState();
            } catch (err) {
                alert(err.message);
            }
        }

        // Clicking a stage pill jumps straight to that stage, forward or
        // back. The Auto toggles only decide what happens BY ITSELF — every
        // stage can still be clicked by hand.
        async function jumpToStage(stage) {
            if (state?.isLive && stage === state?.stage) return;
            const cur = state?.stage;
            const live = state?.live || {};
            const count = state?.matchLabels?.poomsaeCount || 2;

            if (!state?.isLive && state?.liveMatch && cur && !["preparation", "final_results", "category_results"].includes(cur)) {
                if (!confirm(`Match №${state.liveMatch.displayNumber} is still in ${STAGE_LABELS[cur]}. Replace it on the screen with this match?`)) return;
            }
            if (state?.isLive) {
                const ci = STAGE_ORDER.indexOf(cur), ti = STAGE_ORDER.indexOf(stage);
                if (STAGE_TO_ROUND_KEY[stage] && ti < ci) {
                    if (!confirm(`Perform ${STAGE_LABELS[stage]} again? Every judge's score for it is cleared and the judges start from full marks.`)) return;
                }
                if (["results_1", "results_2", "final_results"].includes(stage) && STAGE_TO_ROUND_KEY[cur] && live.allJudgesSubmitted !== true) {
                    if (!confirm("Not every judge has submitted this poomsae — missing judges count as full marks. Continue anyway?")) return;
                }
                if (stage === "final_results" && count >= 2 && ci < STAGE_ORDER.indexOf("poomsae_2")) {
                    if (!confirm("Poomsae 2 hasn't been performed yet. Show Final Results and save the result anyway?")) return;
                }
            }
            try {
                await api(`/stage/${stage}`, "POST");
                await loadState();
            } catch (err) {
                alert(err.message);
            }
        }

        async function jumpToMatch(matchId) {
            if (state && state.match && state.match.id === matchId) return;
            try {
                await api(`/jump-to-match/${encodeURIComponent(matchId)}`, "POST");
                await loadState();
            } catch (err) {
                alert(err.message);
            }
        }

        // ── Rendering ────────────────────────────────────────────────────
        function render() {
            renderJudgeChips();

            if (!state || !state.match) {
                document.getElementById("categoryLine").textContent = "No match scheduled on this court.";
                document.getElementById("metaLine").textContent = "";
                document.getElementById("cornersEl").innerHTML = "";
                document.getElementById("lifecycleEl").innerHTML = "";
                document.getElementById("queuePanelEl").innerHTML = "";
                document.getElementById("liveLine").innerHTML = "";
                renderActions(false, true, null, (state && state.settings) || {}, {});
                return;
            }

            const m = state.match;
            const live = state.live || {};
            const labels = state.matchLabels || {};
            const isLive = !!state.isLive;
            document.getElementById("categoryLine").textContent = labels.category || m.categoryLabel || m.categoryCode || "";
            const modeLabel = { solo: "Solo", duel: "Side by side", para: "Para" }[labels.scoringMode] || "";
            document.getElementById("metaLine").innerHTML =
                `${escapeHtml(labels.roundPhase || m.roundPhase || "")} <span class="accent">№${escapeHtml(labels.displayNumber ?? m.displayNumber ?? "—")}</span> · ${escapeHtml(modeLabel)} · Match ${state.index + 1} of ${state.total}`
                + ((labels.poomsae || []).length
                    ? ` · <span class="accent">${escapeHtml(labels.poomsae.map(p => p.name).join(" + "))}</span>`
                    : ` · <span class="text-muted">no poomsae drawn</span>`);

            renderLiveLine(state.liveMatch, isLive);
            renderActions(isLive, m.red == null, state.stage, state.settings || {}, state.selectedCorners || {});

            document.getElementById("prevMatchBtn").disabled = state.index <= 0;
            document.getElementById("nextMatchBtn").disabled = state.index + 1 >= state.total;
            const nav = state.categoryNav || {};
            document.getElementById("prevCategoryBtn").disabled = !nav.hasPrevious;
            document.getElementById("nextCategoryBtn").disabled = !nav.hasNext;

            if (isLive && state.stage === "category_results") {
                document.getElementById("cornersEl").innerHTML = categoryPreviewHtml(live.categoryResults);
            } else {
                renderCorners(isLive ? (live.corners || {}) : (state.selectedCorners || {}), m.red == null, state.judgesRegistry || {},
                    isLive ? (live.resultsRoundKey || STAGE_TO_ROUND_KEY[state.stage] || null) : null,
                    (state.settings && state.settings.scoring_method) || "sum_all", isLive);
            }
            renderQueuePanel(state.categoryMatches || []);
            renderLifecycle({
                stage: isLive ? state.stage : null,
                isLive,
                poomsae: labels.poomsae || [],
                count: labels.poomsaeCount || 2,
                nextStage: isLive ? state.nextStage : (state.liveMatch ? null : "preparation"),
                settings: state.settings || {},
                settingsLoaded: state.settingsLoaded !== false,
                autoAdvance: isLive ? live.autoAdvance : null,
            });
            renderTimer(isLive ? live : { stageLabel: "Not live", notLive: true });
            renderArchive(isLive ? state.archive : null, isLive && ["final_results", "category_results"].includes(state.stage));
            updateCountdowns();
        }

        function renderArchive(archive, onResults) {
            const el = document.getElementById("archiveLine");
            if (!archive) {
                el.innerHTML = onResults ? `<span class="archive archive--failed">Result not saved</span> <button onclick="saveResults()">Save result</button>` : "";
                return;
            }
            if (archive.state === "saved") {
                el.innerHTML = `<span class="archive archive--saved">✓ Result saved</span>`;
            } else if (archive.state === "saving") {
                el.innerHTML = `<span class="archive archive--saving">Saving result…</span>`
                    + (onResults ? ` <button onclick="saveResults()" title="Nothing came back from Firebase Sync — is it running and enabled?">Retry</button>` : "");
            } else {
                el.innerHTML = `<span class="archive archive--failed" title="${escapeHtml(archive.error || "")}">✕ Save failed${archive.error ? `: ${escapeHtml(archive.error)}` : ""}</span>`
                    + (onResults ? ` <button onclick="saveResults()">Retry</button>` : "");
            }
        }

        async function saveResults() {
            try {
                await api("/results/save", "POST");
                await loadState();
            } catch (err) {
                alert(err.message);
            }
        }

        function renderCorners(corners, isSolo, judgesRegistry, roundKey, scoringMethod, isLive) {
            const el = document.getElementById("cornersEl");
            el.innerHTML = renderCorner(corners.blue, "blue", judgesRegistry, roundKey, scoringMethod, isLive)
                + (isSolo ? "" : renderCorner(corners.red, "red", judgesRegistry, roundKey, scoringMethod, isLive));
        }

        function renderCorner(corner, side, judgesRegistry, roundKey, scoringMethod, isLive) {
            if (!corner) return "";
            const scoresHtml = !isLive
                ? `<div class="not-live-note">Not on the floor yet.<br>Click <strong>Preparation</strong> to put this match on the external screen.</div>`
                : (roundKey == null)
                    ? `<div class="score-waiting">No active poomsae</div>`
                    : buildJudgesTable(corner.judges, judgesRegistry, roundKey, scoringMethod, corner.roundDeduction, corner.roundPenalty, side);
            const currentTotal = corner.finalScore != null ? `Final Score: ${corner.finalScore}` : "";

            return `
            <div class="corner corner-${side}">
                <div class="corner-identity">
                    <div class="corner-name">${escapeHtml(corner.name || "—")}</div>
                    <div class="corner-club">${escapeHtml(corner.clubName || "")}</div>
                    ${currentTotal ? `<div class="corner-current-score">${escapeHtml(currentTotal)}</div>` : ""}
                </div>
                <div class="corner-scores">${scoresHtml}</div>
            </div>
        `;
        }

        // Rows = registered judge slots ∪ judges with data. Missing judges
        // count as full marks; trim_high_low drops highest + lowest Total
        // (3+ judges). Same maths as screen.html and standings.py.
        function buildJudgesTable(judgesMap, judgesRegistry, roundKey, scoringMethod, roundDeduction, roundPenalty, side) {
            const registryNumbers = Object.keys(judgesRegistry || {}).map(Number).filter(isValidJudgeNumber);
            const scoredNumbers = Object.keys(judgesMap || {}).map(Number).filter(isValidJudgeNumber);
            const allNumbers = [...new Set([...registryNumbers, ...scoredNumbers])].sort((a, b) => a - b);

            const entries = allNumbers.map(number => {
                const roundData = judgesMap && judgesMap[number] && judgesMap[number][roundKey];
                const has = !!roundData;
                return {
                    number,
                    edited: !!(roundData && roundData.editedByOperator),
                    status: roundData && roundData.submitted === true ? "submitted" : roundData ? "scoring" : "waiting",
                    accuracy: has ? roundData.accuracy : 4.0,
                    presentation: has ? roundData.presentation : 6.0,
                    total: has ? roundData.total : 10.0,
                    isDefault: !has,
                };
            });

            let included = entries;
            let trimmedNumbers = new Set();
            if (scoringMethod === "trim_high_low" && entries.length >= 3) {
                const sorted = [...entries].sort((a, b) => a.total - b.total);
                trimmedNumbers = new Set([sorted[0].number, sorted[sorted.length - 1].number]);
                included = entries.filter(e => !trimmedNumbers.has(e.number));
            }

            const statusBadge = {
                submitted: `<span class="judge-status judge-status--submitted" title="Submitted">✓ Submitted</span>`,
                scoring: `<span class="judge-status judge-status--scoring" title="Scores in, not submitted yet">Scoring…</span>`,
                waiting: `<span class="judge-status judge-status--waiting" title="Nothing from this judge yet">Waiting</span>`,
            };
            const submittedCount = entries.filter(e => e.status === "submitted").length;
            shownJudgeValues[side] = Object.fromEntries(entries.map(e => [e.number, { accuracy: e.accuracy, presentation: e.presentation }]));
            const editCell = (e, field) =>
                `<td class="num score-edit" title="Click to change Judge ${e.number}'s ${field}" onclick="openScoreEditor('${side}', ${e.number}, '${field}')">${formatScore(e[field])}</td>`;
            const rows = entries.map(e => {
                const classes = [e.isDefault ? "score-default-row" : "", trimmedNumbers.has(e.number) ? "score-trimmed-row" : "", e.status === "submitted" ? "score-submitted-row" : ""].filter(Boolean).join(" ");
                return `
            <tr class="${classes}">
                <td>Judge ${e.number} ${statusBadge[e.status]}${e.edited ? ` <span class="judge-status judge-status--edited" title="Changed by the operator">Edited</span>` : ""}</td>
                ${editCell(e, "accuracy")}
                ${editCell(e, "presentation")}
                <td class="num">${formatScore(e.total)}</td>
            </tr>
        `;
            }).join("");

            const count = included.length || 1;
            const sum = (key) => included.reduce((s, e) => s + (e[key] ?? 0), 0);
            const totalAcc = sum("accuracy"), totalPres = sum("presentation"), totalTot = sum("total");
            const avgAcc = totalAcc / count, avgPres = totalPres / count, avgTot = totalTot / count;

            const restart = roundDeduction ? Number(roundDeduction) : 0;
            const penalty = roundPenalty ? Number(roundPenalty) : 0;
            const finalTotal = avgTot + restart + penalty;
            const fmt = v => `${v > 0 ? "+" : ""}${v.toFixed(1)}`;
            const parts = [];
            if (restart) parts.push(`<span style="color:var(--accent);" title="Restart deduction">R ${fmt(restart)}</span>`);
            if (penalty) parts.push(`<span style="color:#f59e0b;" title="Penalties">P ${fmt(penalty)}</span><button class="penalty-clear" title="Remove penalties" onclick="clearPenalty('${side}')">✕</button>`);
            const deductionCell = parts.length
                ? parts.join(" ")
                : `<span class="text-muted" style="font-size:0.72rem;">No deductions</span>`;

            const allIn = entries.length > 0 && submittedCount === entries.length;
            // One Reset button per match (on the blue panel): during a poomsae
            // or its Results.
            const canReset = !!(STAGE_TO_ROUND_KEY[state.stage] || STAGE_RESULTS_ROUND_KEY[state.stage]);
            const resetBtn = side !== "blue" ? "" : `<button class="reset-full-btn" ${canReset ? "" : "disabled"}
                title="${canReset ? "Start this poomsae completely over — scores, deductions, penalties and timer. No deduction applied." : "Available during a poomsae or its results"}"
                onclick="resetFullPerformance()">&#x21ba; Reset performance</button>`;
            return `
            <div class="scores-head">
                <div class="judges-submitted ${allIn ? "judges-submitted--all" : ""}">${submittedCount} / ${entries.length} judges submitted</div>
                ${resetBtn}
            </div>
            <table class="score-table">
                <thead><tr><th></th><th class="num">Accuracy</th><th class="num">Presentation</th><th class="num">Total</th></tr></thead>
                <tbody>
                    ${rows}
                    <tr class="score-summary-row">
                        <td>Total</td><td class="num">${totalAcc.toFixed(2)}</td><td class="num">${totalPres.toFixed(2)}</td><td class="num">${totalTot.toFixed(1)}</td>
                    </tr>
                    <tr class="score-summary-row">
                        <td>Avg. Points</td><td class="num">${avgAcc.toFixed(3)}</td><td class="num">${avgPres.toFixed(3)}</td><td class="num">${avgTot.toFixed(3)}</td>
                    </tr>
                    <tr class="score-final-row">
                        <td>Final Score</td><td class="num">${deductionCell}</td><td></td><td class="num">${finalTotal.toFixed(3)}</td>
                    </tr>
                </tbody>
            </table>
        `;
        }

        function formatScore(v) {
            return (v === undefined || v === null) ? "—" : Number(v).toFixed(1);
        }

        // What the external screen shows in Category Results, as a table.
        function categoryPreviewHtml(cr) {
            if (!cr) return `<div class="cat-preview"><div class="score-waiting">Building category results…</div></div>`;
            if (cr.error) return `<div class="cat-preview"><div class="score-waiting">Couldn't build category results: ${escapeHtml(cr.error)}</div></div>`;
            const head = `<div class="cat-preview-head"><span>Category Results · ${escapeHtml(cr.roundPhaseLabel || "")}</span><span class="text-muted">${cr.performed ?? 0} / ${cr.total ?? 0} done</span></div>`;
            const fmt = v => v == null ? "—" : Number(v).toFixed(3);

            if (cr.system === "single_elimination") {
                const matches = asArray(cr.matches);
                return `<div class="cat-preview">${head}<table class="score-table"><thead><tr><th>№</th><th>Blue</th><th class="num"></th><th>Red</th><th class="num"></th></tr></thead><tbody>
                    ${matches.map(m => `<tr class="${m.isCurrent ? "current" : ""} ${m.played ? "" : "pending"}">
                        <td>${escapeHtml(m.displayNumberLabel || "")}</td>
                        <td>${m.winner === "blue" ? "<strong>" : ""}${escapeHtml(m.blue?.name || "—")}${m.winner === "blue" ? "</strong> ✓" : ""}</td>
                        <td class="num">${fmt(m.blue?.score)}</td>
                        <td>${m.winner === "red" ? "<strong>" : ""}${escapeHtml(m.red?.name || "—")}${m.winner === "red" ? "</strong> ✓" : ""}</td>
                        <td class="num">${fmt(m.red?.score)}</td>
                    </tr>`).join("")}</tbody></table></div>`;
            }

            const rr = cr.system === "round_robin";
            const rows = asArray(cr.rows);
            return `<div class="cat-preview">${head}<table class="score-table"><thead><tr><th>#</th><th>Athlete</th>${rr ? `<th class="num">W–L</th>` : ""}<th class="num">${rr ? "Points" : "Score"}</th></tr></thead><tbody>
                ${rows.map(r => {
                const badge = r.medal ? `<span class="cat-badge cat-badge--m${r.medal}">${["", "Gold", "Silver", "Bronze"][r.medal]}</span>`
                    : r.qualified ? `<span class="cat-badge cat-badge--q">Q</span>` : "";
                return `<tr class="${r.isCurrent ? "current" : ""} ${r.score == null ? "pending" : ""}">
                        <td>${r.rank ?? ""}</td>
                        <td>${escapeHtml(r.name || "—")}${badge}</td>
                        ${rr ? `<td class="num">${r.wins ?? 0}–${r.losses ?? 0}</td>` : ""}
                        <td class="num">${fmt(r.score)}</td>
                    </tr>`;
            }).join("")}</tbody></table></div>`;
        }

        // RTDB can hand a list back as an object keyed "0", "1", …
        function asArray(v) {
            if (Array.isArray(v)) return v;
            if (v && typeof v === "object") return Object.keys(v).sort((a, b) => a - b).map(k => v[k]);
            return [];
        }

        function renderQueuePanel(categoryMatches) {
            const el = document.getElementById("queuePanelEl");
            el.innerHTML = categoryMatches.map(m => `
                <div class="queue-item ${m.isActive ? "active" : ""}" title="${m.isLive ? "On the floor now" : "Select — click Preparation to put it on the floor"}" onclick="jumpToMatch(${escapeHtml(JSON.stringify(m.id))})">
                    <div class="queue-item-header">
                        <span>${escapeHtml(m.roundPhaseLabel || m.roundPhase || "")}${m.isLive ? `<span class="queue-live-tag">LIVE</span>` : ""}</span>
                        <span>№${escapeHtml(m.displayNumberLabel ?? m.displayNumber ?? "—")}</span>
                    </div>
                    <div class="queue-item-names">
                        ${escapeHtml(m.blueName || "—")}${m.redName ? " vs " + escapeHtml(m.redName) : ""}
                    </div>
                </div>
            `).join("");

            const activeEl = el.querySelector(".queue-item.active");
            if (activeEl) activeEl.scrollIntoView({ block: "nearest" });
        }

        // Seven pills. Not live: only Preparation is clickable. Live: every
        // stage is clickable (Poomsae 2 / Results 2 are off when only one
        // poomsae is performed). The four result stages carry an Auto
        // toggle; a pending automatic step shows its countdown.
        function renderLifecycle({ stage: currentStage, isLive, poomsae, count, nextStage, settings, settingsLoaded, autoAdvance }) {
            const el = document.getElementById("lifecycleEl");
            const currentIdx = isLive ? STAGE_ORDER.indexOf(currentStage) : -1;
            el.innerHTML = STAGE_ORDER.map((stage, i) => {
                const skipped = SECOND_POOMSAE_STAGES.includes(stage) && count < 2;
                const clickable = !skipped && (isLive || stage === "preparation");
                let cls = "stage-pill";
                if (stage === "final_results" || stage === "category_results") cls += " final";
                cls += clickable ? " clickable" : " disabled";
                if (!skipped && i < currentIdx) cls += " done";
                else if (i === currentIdx) cls += " active";
                if (stage === nextStage) cls += " next-step";

                // Sub line: poomsae name, Auto behaviour, or countdown.
                const subs = [];
                const pIdx = STAGE_POOMSAE_INDEX[stage];
                if (pIdx != null && poomsae[pIdx]) subs.push(escapeHtml(poomsae[pIdx].name));
                const isAuto = AUTO_STAGES.includes(stage);
                const autoOn = isAuto && settings[`auto_${stage}`] !== false;
                if (autoAdvance && autoAdvance.to === stage) {
                    subs.push(`<span class="stage-pill-countdown" data-at="${escapeHtml(autoAdvance.at)}">in ${autoAdvance.seconds}s</span>`);
                } else if (autoOn && !skipped && i > currentIdx) {
                    subs.push(autoHint(stage, settings));
                }
                const sub = subs.length ? `<div class="stage-pill-sub">${subs.join(" · ")}</div>` : "";

                const toggle = isAuto && !skipped ? `
                    <label class="auto-toggle ${autoOn ? "on" : ""}" onclick="event.stopPropagation()"
                        title="${escapeHtml(autoTitle(stage, settings))}">
                        <input type="checkbox" ${autoOn ? "checked" : ""} ${settingsLoaded ? "" : "disabled"}
                            onclick="event.stopPropagation()" onchange="setAuto('${stage}', this.checked)">Auto
                    </label>` : "";

                const title = skipped ? "Only one poomsae in this round"
                    : stage === nextStage ? "Next step — click to continue"
                        : !isLive && stage === "preparation" ? "Put this match on the floor and the external screen"
                            : !clickable ? "Click Preparation first" : "";
                const onclick = clickable ? ` onclick="jumpToStage('${stage}')"` : "";
                const arrow = i < STAGE_ORDER.length - 1 ? `<div class="stage-arrow">&darr;</div>` : "";
                return `<div class="${cls}"${onclick}${title ? ` title="${escapeHtml(title)}"` : ""}>
                        <div class="stage-pill-main">${STAGE_LABELS[stage]}${sub}</div>${toggle}
                    </div>${arrow}`;
            }).join("");
        }

        function autoHint(stage, settings) {
            if (stage === "results_1" || stage === "results_2") return "auto on submit";
            if (stage === "final_results") return `auto after ${settings.final_results_delay ?? 5}s`;
            return `auto after ${settings.category_results_delay ?? 8}s`;
        }

        function autoTitle(stage, settings) {
            if (stage === "results_1" || stage === "results_2")
                return "On: shown as soon as every judge submits. Off: waits for you to click it.";
            if (stage === "final_results")
                return `On: shown ${settings.final_results_delay ?? 5}s after the last Results. Off: waits for you to click it.`;
            return `On: shown ${settings.category_results_delay ?? 8}s after Final Results. Off: waits for you to click it.`;
        }

        // Ticks the "in Ns" countdowns locally between polls.
        function updateCountdowns() {
            document.querySelectorAll("[data-at]").forEach(el => {
                const left = Math.max(0, Math.ceil((Date.parse(el.dataset.at) - Date.now()) / 1000));
                el.textContent = `in ${left}s`;
            });
        }
        setInterval(updateCountdowns, 250);

        function renderLiveLine(liveMatch, isLive) {
            const el = document.getElementById("liveLine");
            if (isLive) {
                el.innerHTML = `<span class="live-dot"></span>Live on screen`;
            } else if (liveMatch) {
                el.innerHTML = `<span class="live-dot"></span>Live: №${escapeHtml(liveMatch.displayNumber)} ${escapeHtml(liveMatch.category)} · <button onclick="jumpToMatch(${escapeHtml(JSON.stringify(liveMatch.id))})">go to live match</button>`;
            } else {
                el.innerHTML = `<span class="text-muted">Nothing live — select a match and click Preparation</span>`;
            }
        }

        // Restart: solo, while a poomsae is performed. Penalty: during a
        // poomsae or its Results.
        function renderActions(isLive, isSolo, stage, settings, corners) {
            const inRound = isLive && !!STAGE_TO_ROUND_KEY[stage];
            const penaltyOk = inRound || (isLive && !!STAGE_RESULTS_ROUND_KEY[stage]);
            const restartBtn = document.getElementById("restartBtn");
            const restart = settings.restart_deduction;
            restartBtn.textContent = restart ? `Restart (${restart > 0 ? "+" : ""}${restart})` : "Restart";
            restartBtn.disabled = !inRound || !isSolo;
            restartBtn.title = !isSolo ? "Not available in a side-by-side match"
                : !inRound ? "Available while Poomsae 1 / Poomsae 2 of the live match is performed"
                    : "Clears every judge's score for the CURRENT poomsae — does not touch the timer — and applies the automatic restart deduction";

            const penalty = settings.penalty_deduction ?? -0.3;
            const amount = `${penalty > 0 ? "+" : ""}${penalty}`;
            const disabled = penaltyOk ? "" : "disabled";
            const title = penaltyOk ? "" : ` title="Available during a poomsae or its results"`;
            const name = c => escapeHtml(((corners || {})[c] || {}).name || (c === "blue" ? "Blue" : "Red"));
            document.getElementById("penaltyGroup").innerHTML = isSolo
                ? `<button class="penalty-btn" ${disabled}${title} onclick="givePenalty('blue')">Penalty (${amount})</button>`
                : `<button class="penalty-btn corner-blue-btn" ${disabled}${title} onclick="givePenalty('blue')">Penalty (${amount})<small>${name("blue")}</small></button>
                   <button class="penalty-btn corner-red-btn" ${disabled}${title} onclick="givePenalty('red')">Penalty (${amount})<small>${name("red")}</small></button>`;
        }

        // ── Timer ────────────────────────────────────────────────────────
        // Only the poomsae stages have a timer. Running = remaining at the
        // last start minus elapsed since timerStartedAt, ticked locally.
        function renderTimer(live) {
            clearInterval(countdownTimer);
            const timerEl = document.getElementById("timerEl");
            const label = (live.stageLabel || STAGE_LABELS[state.stage] || "")
                + (live.allJudgesSubmitted === true && STAGE_TO_ROUND_KEY[live.stage] ? " — all judges submitted" : "");
            document.getElementById("timerLabel").textContent = label;

            const duration = live.stageDurationSeconds;
            if (live.notLive) {
                timerEl.className = "timer disabled";
                document.getElementById("timerSub").textContent = "Click Preparation to put this match on the floor";
                document.getElementById("timerClock").textContent = "—";
                return;
            }
            if (duration == null) {
                timerEl.className = "timer disabled";
                document.getElementById("timerSub").textContent = "No timer for this stage";
                document.getElementById("timerClock").textContent = "—";
                return;
            }

            const baseline = live.timerRemainingSeconds != null ? live.timerRemainingSeconds : duration;

            if (!live.timerRunning) {
                timerEl.className = "timer paused";
                document.getElementById("timerSub").textContent = "Click to start";
                document.getElementById("timerClock").textContent = formatClock(Math.max(0, Math.round(baseline)));
                return;
            }

            document.getElementById("timerSub").textContent = "Click to pause";
            const startedAt = live.timerStartedAt ? new Date(live.timerStartedAt).getTime() : Date.now();

            function tick() {
                const elapsed = (Date.now() - startedAt) / 1000;
                const remaining = Math.max(0, Math.round(baseline - elapsed));
                document.getElementById("timerClock").textContent = formatClock(remaining);
                timerEl.className = "timer";
            }
            tick();
            countdownTimer = setInterval(tick, 250);
        }

        async function toggleTimer() {
            const live = state && state.live;
            if (!state || !state.isLive || !live || live.stageDurationSeconds == null) return;

            try {
                if (live.timerRunning) {
                    // The plugin computes the exact paused value itself; this
                    // is only its fallback.
                    const baseline = live.timerRemainingSeconds != null ? live.timerRemainingSeconds : live.stageDurationSeconds;
                    const startedAt = live.timerStartedAt ? new Date(live.timerStartedAt).getTime() : Date.now();
                    const remaining = Math.max(0, baseline - (Date.now() - startedAt) / 1000);
                    await api("/timer/pause", "POST", { remainingSeconds: remaining });
                } else {
                    await api("/timer/start", "POST");
                }
                await loadState();
            } catch (err) {
                alert(err.message);
            }
        }

        function formatClock(totalSeconds) {
            const m = Math.floor(totalSeconds / 60);
            const s = totalSeconds % 60;
            return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        }

        function escapeHtml(str) {
            return String(str ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
        }

        loadState();
        setInterval(loadState, 2000);
    </script>
</body>

</html>
