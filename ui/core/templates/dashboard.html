<!DOCTYPE html>
<html lang="en">

<head>
    <title>TrueVAR - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<!-- Full viewport, no page scroll: each column scrolls on its own, so the
     header, quick controls and logs are always on screen. -->

<body class="bg-gray-900 text-white h-screen overflow-hidden">
    <div class="h-full flex flex-col px-4 py-3 gap-3">
        <div class="flex justify-between items-center border-b border-gray-700 pb-2 shrink-0">
            <h1 class="text-2xl font-bold">System Status</h1>
            <div id="tournamentInfo" class="text-right"></div>
        </div>

        <div id="failureBanner" class="hidden space-y-2 shrink-0 max-h-40 overflow-y-auto"></div>

        <div class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-[minmax(340px,26rem)_1fr] gap-3">
            <!-- Left: plugins -->
            <div class="bg-gray-800 rounded-lg p-4 min-h-0 overflow-y-auto">
                <h3 class="text-lg font-bold mb-2 text-green-400">Active Plugins</h3>
                <div id="pluginList" class="space-y-3">
                    <p class="text-gray-400 italic">Polling engine...</p>
                </div>

                <h3 class="text-lg font-bold mt-4 mb-2 text-purple-400">Attach Plugin</h3>
                <div id="availableList" class="space-y-3">
                    <p class="text-gray-400 italic">Loading...</p>
                </div>
            </div>

            <!-- Right: controls, logs, settings -->
            <div class="min-h-0 flex flex-col gap-3">
                <div id="controlsPanel" class="hidden bg-gray-800 rounded-lg p-4 shrink-0">
                    <h3 class="text-lg font-bold mb-2 text-orange-400">Quick Controls</h3>
                    <div id="controlsList" class="flex flex-wrap gap-3"></div>
                </div>

                <!-- Shown only while the Pipeline Diagnostics plugin is attached -->
                <div id="healthPanel" class="hidden bg-gray-800 rounded-lg p-4 shrink-0">
                    <div class="flex items-center gap-3 mb-2">
                        <h3 class="text-lg font-bold text-emerald-400">Video Path Health</h3>
                        <span id="healthMeta" class="text-xs text-gray-400"></span>
                        <button id="healthToggle" onclick="toggleDiagnostics()"
                            class="ml-auto text-xs px-2 py-1 rounded bg-gray-700 hover:bg-gray-600">…</button>
                    </div>
                    <div id="healthBody" class="overflow-x-auto"></div>
                </div>

                <div class="bg-gray-800 rounded-lg p-4 flex-1 min-h-[10rem] flex flex-col">
                    <div class="flex flex-wrap items-center gap-2 mb-2">
                        <h3 class="text-lg font-bold text-blue-400 mr-1">Live System Logs</h3>
                        <div id="logSources" class="flex flex-wrap gap-1"></div>
                        <input id="logSearch" placeholder="filter  (-clk hides clk)"
                            class="ml-auto bg-gray-900 border border-gray-700 rounded px-2 py-0.5 text-xs w-48">
                        <button id="logPauseBtn" onclick="toggleLogPause()"
                            class="text-xs px-2 py-0.5 bg-gray-700 hover:bg-gray-600 rounded">Pause</button>
                        <button onclick="clearLog()"
                            class="text-xs px-2 py-0.5 bg-gray-700 hover:bg-gray-600 rounded">Clear</button>
                    </div>
                    <div id="logConsole"
                        class="bg-black p-3 rounded flex-1 min-h-0 overflow-y-auto font-mono text-xs leading-5 text-gray-200">
                    </div>
                    <div id="logStatus" class="text-[11px] text-gray-500 mt-1"></div>
                </div>

                <div id="settingsPanel"
                    class="hidden bg-gray-950 border border-gray-700 p-4 rounded max-h-[45%] overflow-y-auto shrink-0">
                    <div class="flex justify-between items-center mb-3">
                        <h4 id="settingsTitle" class="font-bold text-yellow-400">Plugin Settings</h4>
                        <button onclick="closeSettings()" class="text-gray-400 hover:text-white">✕</button>
                    </div>
                    <div id="settingsBody" class="text-sm text-gray-300"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const STATE_COLORS = {
            active: "bg-green-500",
            starting: "bg-blue-400 animate-pulse",
            waiting: "bg-yellow-400 animate-pulse",
            error: "bg-red-500",
            stopped: "bg-gray-500",
            idle: "bg-gray-500",
        };

        const NAMESPACE_LABELS = {
            core: "Core",
            scoring: "Scoring",
            streaming: "Streaming",
            replay: "Replay",
            storage: "Storage",
            uncategorized: "Uncategorized",
        };

        // ------------------------------------------------------------------ live log
        // Entries come from GET /api/system/logs (core/log_hub.py): raw UDP
        // packets, scoreboard events, IVR commands + IVR app logs, pipeline
        // rebuilds, GStreamer errors, diagnostics. Dashboard actions are "ui".

        const LOG_SOURCES = {
            udp: { label: "UDP", badge: "bg-gray-700 text-gray-200" },
            scoreboard: { label: "Scoreboard", badge: "bg-cyan-800 text-cyan-100" },
            ivr: { label: "IVR", badge: "bg-purple-800 text-purple-100" },
            "ivr-app": { label: "IVR app", badge: "bg-fuchsia-900 text-fuchsia-100" },
            pipeline: { label: "Pipeline", badge: "bg-orange-800 text-orange-100" },
            gst: { label: "GStreamer", badge: "bg-amber-800 text-amber-100" },
            diag: { label: "Diagnostics", badge: "bg-emerald-800 text-emerald-100" },
            stats: { label: "Stats", badge: "bg-teal-900 text-teal-100", off: true },
            ui: { label: "Dashboard", badge: "bg-blue-800 text-blue-100" },
        };
        const LEVEL_CLASS = { error: "text-red-400", warning: "text-yellow-300", info: "", debug: "text-gray-500" };
        const MAX_ENTRIES = 5000, MAX_DOM = 2000;

        let logEntries = [];
        let logSeq = 0, logBoot = null, logPaused = false, logPollDelay = 1000;
        let logEnabled = {};
        try { logEnabled = JSON.parse(localStorage.getItem("logSources") || "{}"); } catch (e) { }

        function esc(s) {
            return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }

        function sourceOn(src) {
            if (src in logEnabled) return logEnabled[src];
            return !(LOG_SOURCES[src] && LOG_SOURCES[src].off);
        }

        function renderSourceChips() {
            const seen = new Set([...Object.keys(LOG_SOURCES), ...logEntries.map(e => e.source)]);
            document.getElementById("logSources").innerHTML = [...seen].map(src => {
                const cfg = LOG_SOURCES[src] || { label: src, badge: "bg-gray-700 text-gray-200" };
                const on = sourceOn(src);
                return `<button onclick="toggleSource('${esc(src)}')"
                    class="text-[11px] px-2 py-0.5 rounded ${on ? cfg.badge : "bg-gray-900 text-gray-600 line-through"}">${esc(cfg.label)}</button>`;
            }).join("");
        }

        function toggleSource(src) {
            logEnabled[src] = !sourceOn(src);
            try { localStorage.setItem("logSources", JSON.stringify(logEnabled)); } catch (e) { }
            renderSourceChips();
            rerenderLog();
        }

        function matchesFilter(e) {
            if (!sourceOn(e.source)) return false;
            const q = document.getElementById("logSearch").value.trim().toLowerCase();
            if (!q) return true;
            const hay = `${e.source} ${e.msg}`.toLowerCase();
            return q.split(/\s+/).every(t => t.startsWith("-") ? (t.length < 2 || !hay.includes(t.slice(1))) : hay.includes(t));
        }

        function entryHtml(e) {
            const d = new Date(e.ts * 1000);
            const t = d.toLocaleTimeString([], { hour12: false }) + "." + String(d.getMilliseconds()).padStart(3, "0");
            const cfg = LOG_SOURCES[e.source] || { label: e.source, badge: "bg-gray-700 text-gray-200" };
            const extra = e.data && e.data.debug ? `\n    ${e.data.debug}` : "";
            return `<div class="whitespace-pre-wrap break-words ${LEVEL_CLASS[e.level] || ""}">` +
                `<span class="text-gray-500">${t}</span> <span class="px-1 rounded ${cfg.badge}">${esc(cfg.label)}</span> ${esc(e.msg)}` +
                (extra ? `<span class="text-gray-500">${esc(extra)}</span>` : "") + `</div>`;
        }

        function nearBottom(c) { return c.scrollTop + c.clientHeight >= c.scrollHeight - 40; }

        function appendToConsole(entries) {
            const c = document.getElementById("logConsole");
            const stick = nearBottom(c);
            const html = entries.filter(matchesFilter).map(entryHtml).join("");
            if (html) c.insertAdjacentHTML("beforeend", html);
            while (c.childElementCount > MAX_DOM) c.removeChild(c.firstElementChild);
            if (stick) c.scrollTop = c.scrollHeight;
        }

        function rerenderLog() {
            const c = document.getElementById("logConsole");
            c.innerHTML = "";
            appendToConsole(logEntries.slice(-MAX_DOM * 3));
            c.scrollTop = c.scrollHeight;
        }

        function addEntries(entries) {
            if (!entries.length) return;
            const newSource = entries.some(e => !(e.source in LOG_SOURCES) && !logEntries.some(x => x.source === e.source));
            logEntries.push(...entries);
            if (logEntries.length > MAX_ENTRIES) logEntries = logEntries.slice(-MAX_ENTRIES);
            if (newSource) renderSourceChips();
            if (!logPaused) appendToConsole(entries);
        }

        function log(msg, level = "info") {
            addEntries([{ ts: Date.now() / 1000, source: "ui", level, msg }]);
        }

        function toggleLogPause() {
            logPaused = !logPaused;
            document.getElementById("logPauseBtn").textContent = logPaused ? "Resume" : "Pause";
            if (!logPaused) rerenderLog();
        }

        function clearLog() {
            logEntries = [];
            document.getElementById("logConsole").innerHTML = "";
        }

        async function pollLogs() {
            const status = document.getElementById("logStatus");
            try {
                const res = await fetch(`/api/system/logs?since=${logSeq}&limit=1000`);
                if (res.status === 404) {
                    status.textContent = "Log stream not available: the core does not serve /api/system/logs (include core.log_hub.get_log_router()).";
                    logPollDelay = 10000;
                } else if (res.ok) {
                    const data = await res.json();
                    if (logBoot && data.boot_id !== logBoot) {
                        log("Core restarted — log stream reset.", "warning");
                    }
                    logBoot = data.boot_id;
                    addEntries(data.entries || []);
                    logSeq = data.last_seq;
                    status.textContent = data.file ? `Session timeline: ${data.file}` : "";
                    logPollDelay = 1000;
                }
            } catch (e) {
                status.textContent = `Log stream unreachable (${e}) — retrying…`;
                logPollDelay = 3000;
            }
            setTimeout(pollLogs, logPollDelay);
        }

        // ------------------------------------------------------------------ video path health

        const HEALTH_STATE = {
            ok: "bg-green-900/60 text-green-200",
            waiting: "bg-yellow-900/60 text-yellow-200",
            stalled: "bg-red-800 text-red-100",
            dead: "bg-red-800 text-red-100",
            error: "bg-red-800 text-red-100",
            unknown: "bg-red-900/70 text-red-200",
            idle: "text-gray-600",
            missing: "text-gray-600",
        };
        let diagEnabled = false, healthDelay = 1000;

        function renderHealth(st) {
            diagEnabled = st.enabled;
            const btn = document.getElementById("healthToggle");
            btn.textContent = st.enabled ? "Probes ON" : "Probes OFF";
            btn.className = `ml-auto text-xs px-2 py-1 rounded ${st.enabled ? "bg-emerald-700 hover:bg-emerald-600" : "bg-gray-700 hover:bg-gray-600"}`;
            document.getElementById("healthMeta").textContent =
                `pipeline ${st.running ? "#" + st.generation + " up " + Math.round(st.pipeline_age_s || 0) + "s" : "NOT RUNNING"}` +
                ` · IVR ${st.ivr.connected ? (st.ivr.recording ? "recording" : "connected, idle") : "DISCONNECTED"}` +
                ` · stall > ${st.stall_ms} ms`;

            const body = document.getElementById("healthBody");
            if (!st.enabled) { body.innerHTML = `<p class="text-sm text-gray-500">Probes are off.</p>`; return; }
            if (!st.sources.length) { body.innerHTML = `<p class="text-sm text-gray-500">No sources monitored.</p>`; return; }

            const heads = st.sources[0].stages.map(s => `<th class="px-2 py-1 font-medium">${esc(s.label)}</th>`).join("");
            const rows = st.sources.map(src => {
                const cells = src.stages.map(s => {
                    const cls = HEALTH_STATE[s.state] || "";
                    const shown = s.state === "idle" || s.state === "missing" ? "—"
                        : s.fps != null ? s.fps.toFixed(1) : s.state;
                    const tip = `${s.state}` + (s.ms_since_last != null ? ` · last frame ${s.ms_since_last} ms ago` : "")
                        + (s.max_gap_ms != null ? ` · max gap ${s.max_gap_ms} ms` : "");
                    return `<td class="px-2 py-1 text-center rounded ${cls}" title="${esc(tip)}">${esc(shown)}</td>`;
                }).join("");
                const shm = src.shm.queue == null ? "—"
                    : `q ${src.shm.queue}/${src.shm.queue_max} ms · ${src.shm.clients} cl · ${src.shm.overruns} drop`;
                const vcls = src.verdict_level === "error" ? "text-red-400" : src.verdict_level === "ok" ? "text-green-400" : "text-yellow-300";
                return `<tr class="border-t border-gray-700">
                    <td class="px-2 py-1 font-medium whitespace-nowrap">${esc(src.label)}</td>${cells}
                    <td class="px-2 py-1 text-xs text-gray-400 whitespace-nowrap">${esc(shm)}</td>
                    <td class="px-2 py-1 text-xs ${vcls}">${esc(src.verdict)}</td></tr>`;
            }).join("");
            body.innerHTML = `<table class="w-full text-sm border-separate border-spacing-y-0.5">
                <thead class="text-xs text-gray-400"><tr><th class="px-2 py-1 text-left">Source</th>${heads}
                <th class="px-2 py-1">shm</th><th class="px-2 py-1 text-left">Verdict</th></tr></thead>
                <tbody>${rows}</tbody></table>
                <p class="text-[11px] text-gray-500 mt-1">fps per stage, left → right along the video path. The first red cell is where the video is lost.</p>`;
        }

        async function pollHealth() {
            const panel = document.getElementById("healthPanel");
            try {
                const res = await fetch("/api/diagnostics/status");
                if (res.ok) {
                    panel.classList.remove("hidden");
                    renderHealth(await res.json());
                    healthDelay = 1000;
                } else {
                    panel.classList.add("hidden");
                    healthDelay = 10000;
                }
            } catch (e) {
                healthDelay = 5000;
            }
            setTimeout(pollHealth, healthDelay);
        }

        async function toggleDiagnostics() {
            const res = await fetch(`/api/diagnostics/enable?on=${!diagEnabled}`, { method: "POST" });
            if (res.ok) renderHealth(await (await fetch("/api/diagnostics/status")).json());
        }

        function loadedTooltip(p) {
            let lines = [`Namespace: ${NAMESPACE_LABELS[p.namespace] || p.namespace}`, `Status: ${p.status}`];
            if (p.message) lines.push(`Message: ${p.message}`);
            lines.push(p.dependencies.length ? `Depends on: ${p.dependencies.join(", ")}` : "Depends on: (none)");
            lines.push(p.required_by.length ? `Required by: ${p.required_by.join(", ")}` : "Required by: (nothing)");
            return lines.join("\n");
        }

        function availableTooltip(p) {
            if (p.dependencies.length === 0) return "No dependencies — ready to attach.";
            return p.dependencies.map(d => `${d.satisfied ? "✓" : "✗"} ${d.class_name}`).join("\n");
        }

        function groupByNamespace(items, nsKey) {
            const groups = {};
            items.forEach(item => {
                const ns = item[nsKey] || "uncategorized";
                if (!groups[ns]) groups[ns] = [];
                groups[ns].push(item);
            });
            return groups;
        }

        function renderTournamentInfo(t) {
            const el = document.getElementById("tournamentInfo");
            if (t.mode === "offline") {
                el.innerHTML = `
            <div class="flex items-center gap-3 justify-end">
                <span class="px-4 py-1 rounded-full text-sm font-bold bg-yellow-600 text-white">OFFLINE</span>
                <button onclick="changeTournament()" class="text-xs px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded">
                    Choose
                </button>
            </div>`;
                return;
            }
            el.innerHTML = `
        <div class="flex items-center gap-3 justify-end">
            <div class="text-right">
                <div class="text-lg font-bold">${t.tournament_name || "Unnamed Tournament"}</div>
                <div class="text-sm text-gray-400">ID: ${t.tournament_id} &nbsp;·&nbsp; Court ${t.court_id ?? "—"}</div>
            </div>
            <button onclick="changeTournament()" class="text-xs px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded">
                Change
            </button>
        </div>`;
        }

        async function changeTournament() {
            if (!confirm("This will stop all running plugins and take you back to tournament selection. Continue?")) return;
            log("Resetting — returning to tournament selection...");
            const res = await fetch("/api/system/change-tournament", { method: "POST" });
            if (res.ok) {
                window.location.href = "/";
            } else {
                log("Failed to reset system.");
            }
        }

        // Tracks class_names we've already logged a failure for, so the log
        // console gets one entry per new failure rather than one every poll.
        let seenFailures = new Set();

        function renderFailures(failed) {
            const el = document.getElementById("failureBanner");
            failed = failed || [];

            if (failed.length === 0) {
                el.classList.add("hidden");
                el.innerHTML = "";
                seenFailures.clear();
                return;
            }

            const currentNames = new Set(failed.map(f => f.class_name));
            seenFailures.forEach(name => {
                if (!currentNames.has(name)) seenFailures.delete(name);
            });

            el.classList.remove("hidden");
            el.innerHTML = failed.map(f => {
                if (!seenFailures.has(f.class_name)) {
                    log(`⚠ ${f.class_name} failed to load: ${f.error}`);
                    seenFailures.add(f.class_name);
                }
                return `
                <div class="bg-red-900/40 border border-red-600 rounded-lg px-4 py-3 flex items-center justify-between">
                    <div>
                        <span class="font-bold text-red-400">⚠ ${f.class_name} failed to attach</span>
                        <span class="text-xs text-gray-400 ml-2">(${NAMESPACE_LABELS[f.namespace] || f.namespace})</span>
                        <div class="text-sm text-gray-300 mt-1">${f.error}</div>
                    </div>
                    <button onclick="attachPlugin('${f.class_name}')"
                        class="text-xs px-3 py-1.5 bg-red-600 hover:bg-red-500 rounded font-bold whitespace-nowrap ml-4">
                        Retry Attach
                    </button>
                </div>`;
            }).join("");
        }

        async function fetchStatus() {
            const res = await fetch("/api/plugins/status");
            const data = await res.json();

            renderTournamentInfo(data.tournament);
            renderFailures(data.failed_plugins);
            renderControls(data.loaded_plugins);

            const list = document.getElementById("pluginList");
            list.innerHTML = "";
            if (data.loaded_plugins.length === 0) {
                list.innerHTML = '<p class="text-gray-400 italic">No plugins attached.</p>';
            }
            const loadedGroups = groupByNamespace(data.loaded_plugins, "namespace");
            Object.keys(loadedGroups).sort().forEach(ns => {
                let html = `<div><div class="text-xs uppercase tracking-wide text-gray-500 mb-1">${NAMESPACE_LABELS[ns] || ns}</div><ul class="space-y-2">`;
                loadedGroups[ns].forEach(p => {
                    const dotColor = STATE_COLORS[p.status] || "bg-gray-500";
                    const canDetach = p.required_by.length === 0;
                    html += `
                <li class="flex items-center gap-2 bg-gray-700/40 rounded px-2 py-1" title="${loadedTooltip(p)}">
                    <button onclick="openSettings('${p.name}')" class="flex items-center min-w-0 flex-1 text-left text-sm hover:underline">
                        <span class="w-2 h-2 rounded-full mr-2 shrink-0 ${dotColor}"></span>
                        <span class="truncate">${p.name}</span>
                    </button>
                    <span class="flex gap-1 shrink-0">
                        <button onclick="restartPlugin('${p.name}')" class="text-xs px-2 py-0.5 bg-blue-600 hover:bg-blue-500 rounded">Restart</button>
                        <button onclick="detachPlugin('${p.name}')"
                            class="text-xs px-2 py-0.5 rounded ${canDetach ? 'bg-red-600 hover:bg-red-500' : 'bg-gray-600 cursor-not-allowed'}"
                            ${canDetach ? '' : 'disabled title="Other plugins depend on this"'}>
                            Detach
                        </button>
                    </span>
                </li>`;
                });
                html += `</ul></div>`;
                list.innerHTML += html;
            });

            const avail = document.getElementById("availableList");
            avail.innerHTML = "";
            if (data.available_plugins.length === 0) {
                avail.innerHTML = '<p class="text-gray-500 italic">Everything is attached.</p>';
            }
            const availGroups = groupByNamespace(data.available_plugins, "namespace");
            Object.keys(availGroups).sort().forEach(ns => {
                let html = `<div><div class="text-xs uppercase tracking-wide text-gray-500 mb-1">${NAMESPACE_LABELS[ns] || ns}</div><ul class="space-y-2">`;
                availGroups[ns].forEach(p => {
                    const canAttach = p.dependencies.every(d => d.satisfied);
                    html += `
                <li class="flex items-center justify-between bg-gray-700/20 rounded px-2 py-1" title="${availableTooltip(p)}">
                    <span class="text-sm text-gray-300">${p.class_name}</span>
                    <button onclick="attachPlugin('${p.class_name}')"
                        class="text-xs px-2 py-1 rounded ${canAttach ? 'bg-purple-600 hover:bg-purple-500' : 'bg-gray-600 cursor-not-allowed'}"
                        ${canAttach ? '' : 'disabled'}>
                        Attach
                    </button>
                </li>`;
                });
                html += `</ul></div>`;
                avail.innerHTML += html;
            });
        }

        // ------------------------------------------------------------------ quick controls

        // Controls come from each plugin's optional get_dashboard_controls().
        let controlBusy = new Set();

        function renderControls(plugins) {
            const panel = document.getElementById("controlsPanel");
            const list = document.getElementById("controlsList");
            const controls = plugins.flatMap(p => (p.controls || []).map(c => ({ ...c, plugin: p.name })));

            if (controls.length === 0) {
                panel.classList.add("hidden");
                list.innerHTML = "";
                return;
            }
            panel.classList.remove("hidden");
            list.innerHTML = controls.map(c => {
                const busy = controlBusy.has(c.id);
                const disabled = c.disabled || busy;
                if (c.type === "link") {
                    return disabled
                        ? `<span class="flex items-center gap-2 bg-gray-700/50 rounded-lg px-3 py-2 text-sm opacity-50 cursor-not-allowed">
                               <span class="font-medium">${c.label}</span></span>`
                        : `<a href="${c.url}" target="_blank" rel="noopener" title="${c.plugin}"
                               class="flex items-center gap-2 bg-gray-700/50 hover:bg-gray-700 rounded-lg px-3 py-2 text-sm">
                               <span class="font-medium">${c.label}</span><span class="text-xs text-blue-400">open ↗</span></a>`;
                }
                const on = !!c.state;
                const track = on ? "bg-green-500" : "bg-gray-600";
                const knob = on ? "translate-x-5" : "translate-x-0";
                return `
                <button onclick="toggleControl('${c.id}', '${c.endpoint}', '${c.label}')"
                    ${disabled ? "disabled" : ""}
                    title="${c.plugin}${c.error ? "\n⚠ " + c.error : ""}"
                    class="flex items-center gap-3 bg-gray-700/50 hover:bg-gray-700 rounded-lg px-3 py-2 text-sm
                           ${disabled ? "opacity-50 cursor-not-allowed" : ""}">
                    <span class="relative inline-flex w-10 h-5 rounded-full transition-colors ${track} ${busy ? "animate-pulse" : ""}">
                        <span class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full transition-transform ${knob}"></span>
                    </span>
                    <span class="font-medium">${c.label}</span>
                    <span class="text-xs ${on ? "text-green-400" : "text-gray-400"}">${busy ? "…" : on ? "ON" : "OFF"}</span>
                    ${c.error && !on ? `<span class="text-xs text-red-400">⚠</span>` : ""}
                </button>`;
            }).join("");
        }

        async function toggleControl(id, endpoint, label) {
            if (controlBusy.has(id)) return;
            controlBusy.add(id);
            fetchStatus();
            log(`Toggling ${label}...`);
            try {
                const res = await fetch(endpoint, { method: "POST" });
                const body = await res.json().catch(() => ({}));
                if (!res.ok) {
                    log(`Failed to toggle ${label}: ${body.detail || res.status}`);
                } else {
                    const state = id.endsWith("_mirror") ? body.mirror
                        : "active" in body ? body.active
                            : "state" in body ? body.state : null;
                    log(`${label}${state === null ? " toggled" : state ? " ON" : " OFF"}.`);
                }
            } catch (e) {
                log(`Failed to toggle ${label}: ${e}`);
            } finally {
                controlBusy.delete(id);
                fetchStatus();
            }
        }

        async function restartPlugin(name) {
            log(`Restarting ${name}...`);
            const res = await fetch(`/api/plugins/${encodeURIComponent(name)}/restart`, { method: "POST" });
            log(res.ok ? `${name} restarted.` : `Failed to restart ${name}.`);
            fetchStatus();
        }

        async function detachPlugin(name) {
            if (!confirm(`Detach ${name}? It will stop running.`)) return;
            log(`Detaching ${name}...`);
            const res = await fetch(`/api/plugins/${encodeURIComponent(name)}/detach`, { method: "POST" });
            if (!res.ok) {
                const err = await res.json();
                log(`Failed to detach ${name}: ${err.detail}`);
            } else {
                log(`${name} detached.`);
            }
            fetchStatus();
        }

        async function attachPlugin(className) {
            log(`Attaching ${className}...`);
            const res = await fetch(`/api/plugins/attach`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ class_name: className }),
            });
            if (!res.ok) {
                const err = await res.json();
                log(`Failed to attach ${className}: ${err.detail}`);
            } else {
                log(`${className} attached.`);
            }
            fetchStatus();
        }

        // ------------------------------------------------------------------ auto-generated settings form

        // pydantic v2 emits nested models either as a direct $ref or as
        // allOf: [{$ref}] depending on version/context — handle both.
        function resolveSchema(fieldSchema, rootSchema) {
            if (fieldSchema.$ref) {
                const refName = fieldSchema.$ref.split("/").pop();
                return rootSchema.$defs?.[refName] || {};
            }
            if (fieldSchema.allOf?.length === 1 && fieldSchema.allOf[0].$ref) {
                const refName = fieldSchema.allOf[0].$ref.split("/").pop();
                return rootSchema.$defs?.[refName] || {};
            }
            return fieldSchema;
        }

        function inputForField(path, fieldSchema, value) {
            const label = fieldSchema.title || path.split(".").pop();
            const desc = fieldSchema.description
                ? `<p class="text-xs text-gray-500 mb-1">${fieldSchema.description}</p>` : "";

            if (fieldSchema.type === "boolean") {
                return `
            <div class="mb-3">
                <label class="flex items-center gap-2 text-sm font-medium">
                    <input type="checkbox" name="${path}" ${value ? "checked" : ""} class="accent-purple-500">
                    ${label}
                </label>
                ${desc}
            </div>`;
            }
            if (fieldSchema.type === "integer" || fieldSchema.type === "number") {
                return `
            <div class="mb-3">
                <label class="block text-sm font-medium mb-1">${label}</label>
                <input type="number" name="${path}" value="${value ?? ""}"
                    step="${fieldSchema.type === "integer" ? "1" : "any"}"
                    class="w-full bg-gray-800 border border-gray-600 rounded px-2 py-1 text-sm">
                ${desc}
            </div>`;
            }
            if (fieldSchema.type === "array") {
                // Only handles arrays of primitives (string/number/integer/boolean),
                // one value per line. Arrays of objects aren't supported yet —
                // see note below.
                const itemType = fieldSchema.items?.type;
                const lines = Array.isArray(value) ? value.join("\n") : "";
                return `
            <div class="mb-3">
                <label class="block text-sm font-medium mb-1">${label}</label>
                <textarea name="${path}" data-field-type="array" data-item-type="${itemType || 'string'}"
                    rows="${Math.max(2, (Array.isArray(value) ? value.length : 2))}"
                    class="w-full bg-gray-800 border border-gray-600 rounded px-2 py-1 text-sm font-mono">${lines}</textarea>
                <p class="text-xs text-gray-500 mt-0.5">One value per line.</p>
                ${desc}
            </div>`;
            }
            // default: string / anything unrecognized falls back to text
            return `
        <div class="mb-3">
            <label class="block text-sm font-medium mb-1">${label}</label>
            <input type="text" name="${path}" value="${value ?? ""}"
                class="w-full bg-gray-800 border border-gray-600 rounded px-2 py-1 text-sm">
            ${desc}
        </div>`;
        }

        function renderSchemaForm(schema, values, rootSchema, prefix = "") {
            let html = "";
            const props = schema.properties || {};
            for (const [key, fieldSchema] of Object.entries(props)) {
                const path = prefix ? `${prefix}.${key}` : key;
                const fieldValue = values ? values[key] : undefined;
                const resolved = resolveSchema(fieldSchema, rootSchema);

                if (resolved.type === "object" && resolved.properties) {
                    html += `
                        <fieldset class="border border-gray-700 rounded p-3 mb-3">
                            <legend class="text-xs uppercase tracking-wide text-gray-400 px-1">${fieldSchema.title || key}</legend>
                            ${renderSchemaForm(resolved, fieldValue || {}, rootSchema, path)}
                        </fieldset>`;
                } else {
                    html += inputForField(path, fieldSchema.type ? fieldSchema : resolved, fieldValue);
                }
            }
            return html;
        }

        // Walks every <input> (not FormData) so unchecked checkboxes are
        // still captured as `false` instead of being silently omitted.
        function formToNestedObject(formEl) {
            const result = {};
            formEl.querySelectorAll("input, textarea").forEach(field => {
                const path = field.name.split(".");
                let cursor = result;
                for (let i = 0; i < path.length - 1; i++) {
                    cursor[path[i]] = cursor[path[i]] || {};
                    cursor = cursor[path[i]];
                }
                const leaf = path[path.length - 1];

                if (field.dataset.fieldType === "array") {
                    const itemType = field.dataset.itemType;
                    const items = field.value.split("\n").map(s => s.trim()).filter(s => s.length > 0);
                    cursor[leaf] = itemType === "integer" || itemType === "number"
                        ? items.map(Number)
                        : items;
                } else if (field.type === "checkbox") {
                    cursor[leaf] = field.checked;
                } else if (field.type === "number") {
                    cursor[leaf] = field.value === "" ? null : Number(field.value);
                } else {
                    cursor[leaf] = field.value;
                }
            });
            return result;
        }

        let currentSettingsPlugin = null;

        async function openSettings(name) {
            currentSettingsPlugin = name;
            const res = await fetch(`/api/plugins/${encodeURIComponent(name)}/settings`);
            if (!res.ok) {
                log(`Failed to load settings for ${name}.`);
                return;
            }
            const data = await res.json();

            document.getElementById("settingsTitle").innerText = `Settings — ${name}`;
            const body = document.getElementById("settingsBody");

            if (data.custom_ui) {
                // Hook for a future hand-built settings UI — the plugin
                // opted out of the auto-form via BasePlugin.settings_ui.
                body.innerHTML = `<p class="text-sm text-gray-400">Custom settings UI (${data.custom_ui}) not wired up yet.</p>`;
            } else {
                body.innerHTML = `
                    <form id="settingsForm">
                        ${renderSchemaForm(data.schema, data.values, data.schema)}
                        <button type="submit" class="mt-1 px-4 py-1.5 bg-green-600 hover:bg-green-500 rounded text-sm font-bold">
                            Save
                        </button>
                    </form>`;
                document.getElementById("settingsForm").addEventListener("submit", saveSettings);
            }

            document.getElementById("settingsPanel").classList.remove("hidden");
        }

        async function saveSettings(e) {
            e.preventDefault();
            const values = formToNestedObject(e.target);
            const res = await fetch(`/api/plugins/${encodeURIComponent(currentSettingsPlugin)}/settings`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ values }),
            });
            if (!res.ok) {
                const err = await res.json();
                log(`Failed to save settings for ${currentSettingsPlugin}: ${JSON.stringify(err.detail)}`);
            } else {
                log(`Settings saved for ${currentSettingsPlugin}.`);
                fetchStatus();
            }
        }

        function closeSettings() {
            document.getElementById("settingsPanel").classList.add("hidden");
            currentSettingsPlugin = null;
        }

        document.getElementById("logSearch").addEventListener("input", rerenderLog);
        renderSourceChips();
        log("Dashboard opened. Waiting for log stream…");

        fetchStatus();
        setInterval(fetchStatus, 5000);
        pollLogs();
        pollHealth();
    </script>
</body>

</html>
