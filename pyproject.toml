# TrueVAR core as an installable library ("truevar-core").
#
# The import names stay exactly what the core app uses (core.*, plugins.*),
# so the Linux case keeps running from this repo unchanged:
#     python -m core.main
#
# Other apps (e.g. TrueVAR-TOO) install it and pick the plugins they need:
#     pip install -e /path/to/TrueVAR-core          # development
#     pip install /path/to/TrueVAR-core             # regular install / wheel
#
# The base dependencies cover the core itself (orchestrator, settings, event
# bus, Firebase, dashboard API) and the platform-independent plugins (Poomsae
# Control, Firebase Sync). The full Linux case stack (GStreamer, IVR, OBS,
# AI cameraman, TkStrike, ...) needs requirements.txt / the "case" extra.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "truevar-core"
version = "0.1.0"
description = "TrueVAR core: plugin orchestrator, event bus, settings and Firebase integration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "structlog>=24",
    "firebase-admin>=6.5",
    "google-cloud-firestore>=2.16",
    "httpx>=0.27",
    "psutil>=5.9",
    "tzdata",            # zoneinfo on Windows has no system time zone database
]

[project.optional-dependencies]
# Everything the Linux TrueVAR case runs (see requirements.txt for exact pins).
case = [
    "python-socketio>=5",
    "websockets>=12",
    "PyGObject>=3.46",
    "pyserial>=3.5",
    "obs-websocket-py>=1.0",
    "opencv-python>=4.9",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "plugins*", "ui.core.templates"]
namespaces = true

[tool.setuptools.package-data]
# HTML/JS/CSS/JSON the plugins serve or load at runtime, the dashboard
# templates, and the Poomsae helpers loaded by file path.
"*" = ["*.html", "*.js", "*.css", "*.json", "*.svg", "*.png", "static/*", "static/**/*"]
